function validText(v,label,max=5000){if(typeof v!=='string'||!v.trim()||v.length>max)throw Error(label+'不能为空且不得超过 '+max+' 字符');return v.trim();}
function validateSample(x){return {id:uid(),input:validText(x.input,'输入'),expected:validText(x.expected,'预期'),actual:validText(x.actual,'成果'),reference:['通过','不通过','待标注'].includes(x.reference)?x.reference:(()=>{throw Error('人工参考无效')})(),bucket:buckets.includes(x.bucket)?x.bucket:(()=>{throw Error('用途分桶无效')})(),source:validText(x.source,'来源')};}
function validateStore(x){if(!x||x.schema!==1||!Array.isArray(x.sets)||!Array.isArray(x.evaluators)||!Array.isArray(x.experiments))throw Error('存储结构无效');for(const d of x.sets){validText(d.id,'ID',100);validText(d.name,'名称',100);if(!Array.isArray(d.samples)||!Array.isArray(d.versions))throw Error('评测集无效');d.samples.forEach(validateSample);}return x;}
let quality=seedQuality(),storageError='',isNewStore=true;try{const raw=localStorage.getItem(STORE);if(raw){isNewStore=false;quality=validateStore(JSON.parse(raw));}}catch(e){storageError='本地数据无法读取，原存储保留；演示只读：'+e.message;}

function saveEvaluator(id,publish){guarded(()=>{const type=val('e-type');if(!types.includes(type))throw Error('类型无效');const config={};if(type!=='人工参考'){const t=val('e-threshold');config.threshold=Number(t);if(!t||!Number.isFinite(config.threshold)||config.threshold<0||config.threshold>1)throw Error('阈值需在 0–1');}else config.threshold=0.5;if(type==='规则')config.keyword=validText(val('e-keyword'),'关键词',100);if(type==='模型'){config.model=validText(val('e-model'),'模型',100);config.prompt=validText(val('e-prompt'),'提示词');}if(type==='组合'){config.members=[...document.getElementById('e-members').selectedOptions].map(o=>o.value);if(!config.members.length)throw Error('组合至少选择一个发布成员');config.memberSnapshots=config.members.map(r=>freezeEvaluator(resolveEvaluator(r)));}const draft={name:validText(val('e-name'),'名称',100),type,scope:validText(val('e-scope'),'范围',100),config};if(change(()=>{let e=findEval(id);if(!e){e={id:uid(),versions:[]};quality.evaluators.push(e);}Object.assign(e,draft);if(publish)e.versions.push({...clone(draft),number:e.versions.length+1,at:new Date().toISOString()});})){closeModal();render();}});}

function scoreSample(s,e,depth=0){if(depth>12)throw Error('组合引用过深');if(e.scope!=='全部'&&!s.input.includes(e.scope))return {score:null,pass:null,reason:'范围外'};let score;if(e.type==='规则')score=s.actual.includes(e.config.keyword)?1:0;else if(e.type==='人工参考'){if(s.reference==='待标注')return {score:null,pass:null,reason:'缺少独立人工参考'};score=s.reference==='通过'?1:0;}else if(e.type==='模型')score=hash(s.input+s.expected+s.actual+e.config.model+e.config.prompt)%101/100;else {const values=(e.config.memberSnapshots||e.config.members.map(resolveEvaluator)).map(m=>scoreSample(s,m,depth+1).score).filter(v=>v!==null);if(!values.length)return {score:null,pass:null,reason:'所有组合成员范围外'};score=values.reduce((a,b)=>a+b,0)/values.length;}return {score,pass:score>=e.config.threshold,reason:e.type==='模型'?'确定性模拟模型评分（无调用）':e.type==='规则'?(score?'成果包含关键词：':'成果缺少关键词：')+e.config.keyword:e.type==='人工参考'?'读取独立人工标签':'冻结成员平均分'};}
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
function hasHumanReference(e,depth=0){if(depth>12)throw Error('组合引用过深');return e.type==='人工参考'||(e.type==='组合'&&(e.config.memberSnapshots||e.config.members.map(resolveEvaluator)).some(m=>hasHumanReference(m,depth+1)));}
function testEvaluator(id){const e=findEval(id);modal('范围测试 · '+e.name,`${field('输入','t-input','经营报告')}${field('预期','t-expected','完整且有证据')}${field('成果','t-actual','完整报告附证据','textarea')}${field('独立人工参考','t-reference','通过','select',['通过','不通过'])}<div id="test-result" class="notice">测试当前草稿，不改变版本。</div>`,btn('关闭','closeModal()')+btn('执行本地测试',`runEvaluatorTest(${jsarg(id)})`,true));}

function dataRefs(){return quality.sets.flatMap(d=>d.versions.map(v=>({value:d.id+':'+v.number,label:d.name+' v'+v.number})));}
function resolveData(ref){const [id,n]=ref.split(':');const v=findSet(id)?.versions.find(v=>v.number===Number(n));if(!v)throw Error('必须绑定已发布数据版本');return v;}
function experimentsPage(){const list=quality.experiments.filter(e=>(expFilter==='全部'||e.state===expFilter)&&(e.name+e.kind).includes(expSearch));return title('实验与对比','方案对照与判定校准分离；运行与指标均为本地模拟。',btn('创建实验','createExperiment()',true))+`<div class="toolbar"><input aria-label="搜索实验" placeholder="实验名称 / 类型" value="${esc(expSearch)}" onchange="expSearch=this.value;render()"><select aria-label="实验状态" onchange="expFilter=this.value;render()">${options(['全部','排队','运行中','已完成','失败','已取消'],expFilter)}</select></div><div class="card table-wrap"><table><thead><tr><th>比较</th><th>实验</th><th>类型 / 数据版本</th><th>状态 / 尝试</th><th>操作</th></tr></thead><tbody>${list.map(e=>`<tr><td>${e.state==='已完成'?`<input type="checkbox" aria-label="选择实验 ${esc(e.name)}" ${comparison.has(e.id)?'checked':''} onchange="${esc(`this.checked?comparison.add(${jsarg(e.id)}):comparison.delete(${jsarg(e.id)})`)}">`:'—'}</td><td>${esc(e.name)}</td><td>${esc(e.kind)} / ${esc(e.dataRef)}</td><td>${esc(e.state)} / ${e.attempt}</td><td>${btn('详情',`experimentDetail(${jsarg(e.id)})`)}${['排队','运行中'].includes(e.state)?btn('取消',`transitionExperiment(${jsarg(e.id)},'已取消')`):e.state==='失败'?btn('重试',`retryExperiment(${jsarg(e.id)})`):''}</td></tr>`).join('')||'<tr><td colspan="4">暂无匹配实验</td></tr>'}</tbody></table></div>`+btn('比较所选完成实验','compareExperiments()',true)+notice();}
function createExperiment(kind='方案对照'){if(!dataRefs().length||!evaluatorRefs().length)return toast('请先发布评测集及评估器版本');modal('创建本地模拟实验',`<div class="form-grid">${field('名称','x-name','')}${field('类型','x-kind',kind,'select',['方案对照','判定校准'])}${field('发布数据版本','x-data',dataRefs()[0].value,'select',dataRefs())}${field('用途分桶（校准实验仅校准或保留测试）','x-bucket',kind==='判定校准'?'校准':'方案对照','select',buckets)}${field('基线方案版本','x-base','方案-v1')}${field('候选方案版本','x-candidate','方案-v2')}${field('评估器发布版本','x-eval',evaluatorRefs()[0].value,'select',evaluatorRefs())}${field('模拟故障','x-fail','正常','select',['正常','本次运行失败'])}</div><div class="notice">判定校准将评估器输出对照独立人工参考，方案字段仅保留来源上下文。不会使用方案改进作为判定器可靠性证据。</div>`,btn('取消','closeModal()')+btn('创建并排队','saveExperiment()',true));}
function saveExperiment(){guarded(()=>{const name=validText(val('x-name'),'实验名称',100),kind=val('x-kind'),dataRef=val('x-data'),evalRef=val('x-eval'),bucket=val('x-bucket'),baseline=validText(val('x-base'),'基线',100),candidate=validText(val('x-candidate'),'候选',100);if(!['方案对照','判定校准'].includes(kind)||!buckets.includes(bucket))throw Error('类型 / 用途无效');if(kind==='方案对照'&&(bucket!=='方案对照'||baseline===candidate))throw Error('方案对照需独立分桶及不同方案版本');if(kind==='判定校准'&&bucket==='方案对照')throw Error('校准不能使用方案对照桶');const data=clone(resolveData(dataRef)),evaluator=freezeEvaluator(resolveEvaluator(evalRef)),samples=data.samples.filter(s=>s.bucket===bucket);if(!samples.length)throw Error('发布版本中所选桶没有样本');if(kind==='判定校准'&&samples.some(s=>s.reference==='待标注'))throw Error('校准样本必须有独立人工参考');if(kind==='判定校准'&&hasHumanReference(evaluator))throw Error('校准不能用人工参考或含人工参考的组合自证可靠性');if(!samples.some(s=>evaluator.scope==='全部'||s.input.includes(evaluator.scope)))throw Error('样本均不在评估器适用范围');const failure=val('x-fail');if(!['正常','本次运行失败'].includes(failure))throw Error('故障选项无效');const e={id:uid(),name,kind,dataRef,evalRef,data,evaluator,samples:clone(samples),baseline,candidate,bucket,fail:failure!=='正常',state:'排队',attempt:1,created:new Date().toISOString(),events:[],rows:[]};if(change(()=>quality.experiments.push(e))){closeModal();render();scheduleExperiment(e.id);}});}
const runTimers=new Map();
function scheduleExperiment(id){const e=findExp(id);if(!e||!['排队','运行中'].includes(e.state)||runTimers.has(id))return;const timer=setTimeout(()=>{runTimers.delete(id);const e=findExp(id);if(!e)return;if(e.state==='排队'){transitionExperiment(id,'运行中');scheduleExperiment(id);}else if(e.state==='运行中')finishExperiment(id);},e.state==='排队'?1200:1800);runTimers.set(id,timer);}
function transitionExperiment(id,state){const ok=change(()=>{const e=findExp(id);const allowed={'排队':['运行中','已取消'],'运行中':['已完成','失败','已取消']};if(!allowed[e.state]?.includes(state))throw Error('非法运行状态变更');e.state=state;e.events.push({state,at:new Date().toISOString(),attempt:e.attempt});});if(ok){if(state==='已取消'){clearTimeout(runTimers.get(id));runTimers.delete(id);}render();}return ok;}
function deriveRows(e){return e.samples.map(s=>{const base=scoreSample(s,e.evaluator);if(e.kind==='判定校准')return {sampleId:s.id,input:s.input,source:s.source,reference:s.reference,...base,cost:(hash(s.id+e.evalRef)%900+100)/100,falseAccept:base.pass===true&&s.reference==='不通过',falseReject:base.pass===false&&s.reference==='通过'};const candidateActual=hash(s.id+e.candidate)%3===0?s.actual+' '+(e.evaluator.config.keyword||'证据'):s.actual;const candidate=scoreSample({...s,actual:candidateActual},e.evaluator);const baselineCost=(hash(s.id+e.baseline)%900+100)/100,candidateCost=(hash(s.id+e.candidate)%900+100)/100;return {sampleId:s.id,input:s.input,source:s.source,baseline:{...base,actual:s.actual,cost:baselineCost},candidate:{...candidate,actual:candidateActual,cost:candidateCost},scoreDelta:base.score===null||candidate.score===null?null:candidate.score-base.score,costDelta:candidateCost-baselineCost};});}
function summarize(e){const rows=e.rows;if(e.kind==='判定校准'){const valid=rows.filter(r=>r.score!==null),fa=valid.filter(r=>r.falseAccept).length,fr=valid.filter(r=>r.falseReject).length;return {samples:rows.length,inScope:valid.length,excluded:rows.length-valid.length,falseAccept:fa,falseReject:fr,agreement:valid.length?(valid.length-fa-fr)/valid.length:null,note:'独立人工参考对照；仅当前冻结样本，非业务验收或扩权依据'};}const valid=rows.filter(r=>r.baseline.score!==null&&r.candidate.score!==null);return {samples:rows.length,inScope:valid.length,excluded:rows.length-valid.length,baselinePass:valid.filter(r=>r.baseline.pass).length,candidatePass:valid.filter(r=>r.candidate.pass).length,baselineCost:rows.reduce((a,r)=>a+r.baseline.cost,0),candidateCost:rows.reduce((a,r)=>a+r.candidate.cost,0),note:'质量与成本由逐样本模拟记录派生；无真实执行或统计显著性结论'};}
function finishExperiment(id){const e=findExp(id);if(e.state!=='运行中')return;if(e.fail){change(()=>{e.error='模拟执行器失败；冻结输入保留';});transitionExperiment(id,'失败');return;}if(change(()=>{e.rows=deriveRows(e);e.summary=summarize(e);})){transitionExperiment(id,'已完成');}}
function retryExperiment(id){if(change(()=>{const e=findExp(id);if(e.state!=='失败')throw Error('仅失败实验可重试');e.state='排队';e.attempt++;e.fail=false;e.rows=[];delete e.summary;delete e.error;e.events.push({state:'排队',at:new Date().toISOString(),attempt:e.attempt});})){render();scheduleExperiment(id);}}

function freezeEvaluator(e,depth=0){if(depth>12)throw Error('组合引用过深');const frozen=clone(e);if(frozen.type==='组合')frozen.config.memberSnapshots=(e.config.memberSnapshots||e.config.members.map(resolveEvaluator)).map(m=>freezeEvaluator(m,depth+1));return frozen;}
function wilson(k,n){if(!n)return null;const z=1.95996398454,p=k/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return [Math.max(0,c-h),Math.min(1,c+h)];}
const originalSummary=summarize;
summarize=function(e){const a=originalSummary(e);if(e.kind==='判定校准'){const rows=e.rows.filter(r=>r.pass!==null&&['通过','不通过'].includes(r.reference)),positive=rows.filter(r=>r.reference==='通过').length,negative=rows.length-positive;Object.assign(a,{totalCost:e.rows.reduce((n,r)=>n+(r.cost||0),0),inScope:rows.length,excluded:e.rows.length-rows.length,trueAccept:rows.filter(r=>r.pass&&r.reference==='通过').length,trueReject:rows.filter(r=>!r.pass&&r.reference==='不通过').length,positive,negative,falseAcceptRate:negative?a.falseAccept/negative:null,falseRejectRate:positive?a.falseReject/positive:null,falseAcceptCI:wilson(a.falseAccept,negative),falseRejectCI:wilson(a.falseReject,positive),agreement:rows.length?(rows.length-a.falseAccept-a.falseReject)/rows.length:null});}else{const rows=e.rows.filter(r=>r.baseline.score!==null&&r.candidate.score!==null);a.baselineMean=rows.length?rows.reduce((n,r)=>n+r.baseline.score,0)/rows.length:null;a.candidateMean=rows.length?rows.reduce((n,r)=>n+r.candidate.score,0)/rows.length:null;}return a;};
let sampleSearch='',sampleBucket='全部',sampleVersion='草稿',evalSearch='',evalType='全部';const comparison=new Set();
function sampleTable(samples,editable=false){const rows=samples.filter(x=>(sampleBucket==='全部'||x.bucket===sampleBucket)&&(x.input+x.expected+x.actual+x.source).includes(sampleSearch));return `<div class="table-wrap"><table class="table-evidence"><thead><tr><th>输入 / 来源</th><th>预期成果</th><th>实际成果</th><th>人工参考 / 用途</th>${editable?'<th>操作</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.input)}<p>${esc(x.source)}</p></td><td>${esc(x.expected)}</td><td>${esc(x.actual)}</td><td>${esc(x.reference)} / ${esc(x.bucket)}</td>${editable?`<td>${btn('编辑',`editSample(${jsarg(x.id)})`)}${btn('删除',`deleteSample(${jsarg(x.id)})`)}</td>`:''}</tr>`).join('')||'<tr><td colspan="5">没有匹配样本</td></tr>'}</tbody></table></div>`;}
function openSet(id){if(activeSet!==id){sampleVersion='草稿';sampleSearch='';sampleBucket='全部';}activeSet=id;const d=findSet(id),v=d.versions.find(v=>String(v.number)===sampleVersion),editable=!v;modal(d.name,`<p>${esc(d.description)}</p><div class="actions" style="margin:16px 0">${btn('新增样本','editSample()')}${btn('JSON 导入','importDialog()')}${btn('发布版本','publishSet()',true)}${btn('导出',`download('评测集',findSet(activeSet))`)}</div><div class="toolbar"><input aria-label="搜索样本" placeholder="输入、成果或来源" value="${esc(sampleSearch)}" onchange="sampleSearch=this.value;openSet(activeSet)"><select aria-label="用途筛选" onchange="sampleBucket=this.value;openSet(activeSet)">${options(['全部',...buckets],sampleBucket)}</select><select aria-label="版本切换" onchange="sampleVersion=this.value;openSet(activeSet)">${options([{value:'草稿',label:'当前草稿'},...d.versions.map(v=>({value:String(v.number),label:'发布 v'+v.number}))],sampleVersion)}</select></div><p>${v?'只读发布快照 · '+esc(v.at):'可编辑草稿'} · ${(v||d).samples.length} 样本</p>${sampleTable((v||d).samples,editable)}<h3>发布历史</h3>${d.versions.map(v=>btn('v'+v.number,`viewVersion(${v.number})`)).join('')}`+notice(),btn('关闭','closeModal()'),true);}
function viewVersion(n){sampleVersion=String(n);openSet(activeSet);}
function evaluatorFields(type,c={}){return (type!=='人工参考'?field('阈值（0–1）','e-threshold',String(c.threshold??0.6)):'<p>直接读取独立标签，无额外参数。</p>')+(type==='规则'?field('成果匹配关键词','e-keyword',c.keyword||'证据'):type==='模型'?field('模拟模型名称','e-model',c.model||'离线模拟-v1')+field('评分提示词','e-prompt',c.prompt||'检查预期成果完整性','textarea'):type==='组合'?`<label class="field">已发布成员（多选，保存时冻结）<select id="e-members" multiple>${evaluatorRefs().map(r=>`<option value="${esc(r.value)}" ${(c.members||[]).includes(r.value)?'selected':''}>${esc(r.label)}</option>`).join('')}</select></label>`:'');}
function editEvaluator(id){const e=findEval(id);modal('评估器配置草稿',`<div class="form-grid">${field('名称','e-name',e?.name||'')}${field('类型','e-type',e?.type||'规则','select',types).replace('<select','<select onchange="document.getElementById(\'e-fields\').innerHTML=evaluatorFields(this.value)"')}${field('适用范围：全部或输入关键词','e-scope',e?.scope||'全部')}<div id="e-fields" class="field full">${evaluatorFields(e?.type||'规则',e?.config)}</div></div><h3>发布版本</h3>${e?.versions.map(v=>`<details><summary>v${v.number} · ${esc(v.type)} · ${esc(v.scope)}</summary><pre>${esc(JSON.stringify(v,null,2))}</pre></details>`).join('')||'暂无'}`+notice(),btn('取消','closeModal()')+btn('保存草稿',`saveEvaluator(${jsarg(id||'')},false)`)+btn('保存并发布',`saveEvaluator(${jsarg(id||'')},true)`,true),true);}

function number(v){return v===null||v===undefined?'—':Number(v).toFixed(2);}
function rate(v){return v===null||v===undefined?'—':(100*v).toFixed(1)+'%';}
function resultCell(r){return `分数 ${number(r.score)} · ${r.pass===null?'范围外':r.pass?'通过':'不通过'}<br>成本 ${number(r.cost)}<p>${esc(r.reason||'')}</p>${r.actual?`<p>${esc(r.actual)}</p>`:''}`;}
function summaryCards(e){const a=summarize(e);if(e.kind==='方案对照')return `<div class="metrics">${metric('有效 / 总样本',a.inScope+'/'+a.samples,'','')}${metric('通过数：基线 → 候选',a.baselinePass+' → '+a.candidatePass,'','')}${metric('平均分：基线 → 候选',number(a.baselineMean)+' → '+number(a.candidateMean),'','')}${metric('模拟总成本',number(a.baselineCost)+' → '+number(a.candidateCost),'','')}</div>`;return `<div class="metrics">${metric('有效 / 总样本',a.inScope+'/'+a.samples,'','')}${metric('一致率',rate(a.agreement),'','')}${metric('误放行率',rate(a.falseAcceptRate),'',a.falseAccept+' / '+a.negative+' 人工不通过')}${metric('误拒绝率',rate(a.falseRejectRate),'',a.falseReject+' / '+a.positive+' 人工通过')}</div><h3>混淆矩阵</h3><table><tr><th>预测 / 人工参考</th><th>通过</th><th>不通过</th></tr><tr><td>通过</td><td>${a.trueAccept}</td><td>${a.falseAccept}（误放行）</td></tr><tr><td>不通过</td><td>${a.falseReject}（误拒绝）</td><td>${a.trueReject}</td></tr></table><p>Wilson 95% 区间：误放行 ${a.falseAcceptCI?a.falseAcceptCI.map(rate).join(' – '):'无分母'}；误拒绝 ${a.falseRejectCI?a.falseRejectCI.map(rate).join(' – '):'无分母'}。范围外 ${a.excluded} 条不进入分母。模拟总成本 ${number(a.totalCost)}。</p>`;}
function experimentDetail(id){const e=findExp(id);modal(e.name,`<div class="detail-summary"><div>${esc(e.kind)}</div><div>${esc(e.state)} · 尝试 ${e.attempt}</div><div>${esc(e.dataRef)} / ${esc(e.bucket)}</div><div>${esc(e.evalRef)} / ${esc(e.data.standard||'来源标准见快照')}</div></div><p>${esc(e.baseline)} → ${esc(e.candidate)}</p><p>${esc(e.error||'')}</p>${e.state==='已完成'?summaryCards(e):'<div class="notice">当前无完成结果，失败不计为零分。</div>'}<h3>逐样本对照</h3><div class="table-wrap"><table class="table-evidence"><thead><tr><th>输入 / 来源</th><th>基线 / 判定器</th><th>候选 / 人工参考</th><th>差异 / 误判</th></tr></thead><tbody>${e.rows.map(r=>`<tr><td>${esc(r.input)}<p>${esc(r.source)}</p></td><td>${resultCell(r.baseline||r)}</td><td>${r.candidate?resultCell(r.candidate):esc(r.reference)}</td><td>${e.kind==='方案对照'?`分数差 ${number(r.scoreDelta)}<br>成本差 ${number(r.costDelta)}<p>${r.baseline.actual===r.candidate.actual?'成果相同':'候选补充内容：'+esc(r.candidate.actual.slice(r.baseline.actual.length))}</p>`:r.falseAccept?'误放行':r.falseReject?'误拒绝':r.pass===null?'范围外':'判定一致'}</td></tr>`).join('')||'<tr><td colspan="4">尚无逐样本结果</td></tr>'}</tbody></table></div><h3>运行时间线</h3><div class="timeline"><div class="event">创建<small>${esc(e.created)}</small></div>${e.events.map(v=>`<div class="event">${esc(v.state)} · 尝试 ${v.attempt}<small>${esc(v.at)}</small></div>`).join('')}</div><details><summary>原始 JSON · 冻结数据与运行记录</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify(e,null,2))}</pre></details>`+notice(),btn('关闭','closeModal()')+btn('刷新',`experimentDetail(${jsarg(id)})`)+btn('导出',`download('实验结果',findExp(${jsarg(id)}))`),true);}

function mEditConfig(kind,id){mSafe(()=>{mRequire(uxActionPermission(kind));const old=management[kind].find(x=>x.id===id&&mScope(x));if(id&&!old)throw Error('对象不在当前范围');mEditingData=mCopy(old||mTemplate(kind));if(kind==='agents'&&!mEditingData.executionVersions)mEditingData.executionVersions=mAgentVersions(mEditingData);const specs=mConfigFields[kind];if(!specs)throw Error('请使用集成配置向导');modal('编辑 '+({agents:'Agent 资产',baselines:'基线草稿',members:'成员范围',rules:'观测规则'}[kind]),'<p>保存校验范围和数值，历史版本保留。资产版本是登记版本，执行版本用于运行目标选择。</p><div class="form-grid">'+specs.map(([label,k,type])=>{const x=mEditingData[k];return field(label,'mc-'+k,Array.isArray(x)?x.join(type==='lines'?'\n':','):type==='boolean'?(x===false?'停用':'启用'):x??'',type==='lines'?'textarea':['boolean','role','rule'].includes(type)?'select':'text',type==='boolean'?['启用','停用']:type==='role'?mRoles:type==='rule'?['未知成本','回传异常','待确认时长','返工']:[]);}).join('')+'</div>',btn('取消','closeModal()')+mButton('保存',`mSafe(()=>mSaveConfigForm('${kind}',${jsarg(id||'')}))`,uxActionPermission(kind)),true);});}
function mSaveConfigForm(kind,id){const x=mCopy(mEditingData);for(const [,k,type] of mConfigFields[kind]){const v=val('mc-'+k);x[k]=type==='boolean'?v==='启用':type==='number'?Number(v):type==='optional'?mOptional(v,'基准成本'):type==='lines'?v.split('\n').map(x=>x.trim()).filter(Boolean):Array.isArray(x[k])?v.split(',').map(x=>x.trim()).filter(Boolean):v;}mSaveConfig(kind,id,x);closeModal();render();}
function mValidateConfig(kind,x){const text=k=>x[k]=validText(x[k],k,500);if(kind==='agents'){['name','externalId','owner','scope','framework'].forEach(text);if(!Array.isArray(x.capabilities)||x.capabilities.some(c=>!['任务事件','用户判定','成本','Trace'].includes(c)))throw Error('能力标签无效');x.enabled=!!x.enabled;if(x.executionVersions&&(!Array.isArray(x.executionVersions)||!x.executionVersions.length||x.executionVersions.some(v=>typeof v!=='string'||!v.trim())))throw Error('执行版本不能为空');if(management.agents.some(a=>a.tenant===mTenant&&a.externalId===x.externalId&&a.id!==x.id))throw Error('外部 Agent ID 重复');}
if(kind==='integrations'){['source','entry'].forEach(text);if(!x.entry.startsWith('local://'))throw Error('原型回传入口必须为 local://，不保存凭据');if(!x.mapping||!['task','agent','user'].every(k=>typeof x.mapping[k]==='string'&&x.mapping[k].trim()))throw Error('缺少 task / agent / user 字段映射');if(!Array.isArray(x.users)||!x.users.length||x.users.some(u=>typeof u!=='string'||!u.trim())||!Array.isArray(x.scopes)||!x.scopes.length)throw Error('来源用户与授权范围不能为空');if(!Array.isArray(x.capabilities)||!x.capabilities.includes('任务事件')||x.capabilities.some(c=>!['任务事件','用户判定','成本','Trace'].includes(c)))throw Error('接入能力无效');if(management.integrations.some(i=>i.tenant===mTenant&&i.source===x.source&&i.id!==x.id))throw Error('同租户来源重复');x.connected=!!x.connected;x.step=Number(x.step||1);if(!Number.isInteger(x.step)||x.step<1||x.step>6)throw Error('向导步骤无效');}
if(kind==='baselines'){['scope','quality','source'].forEach(text);x.minutes=mOptional(String(x.minutes),'工时');x.rate=mOptional(String(x.rate),'费率');if(x.minutes===null||x.rate===null||!Array.isArray(x.samples)||!x.samples.length||x.samples.some(s=>typeof s!=='string'||!s.trim()))throw Error('基线需工时、费率与来源样本证据');x.cost=mOptional(String(x.cost??''),'基准成本');x.state='草稿';x.reviewer='';}
if(kind==='members'){['name','team','scope'].forEach(text);if(!mRoles.includes(x.role)||(typeof uxRBAC==='function'&&!Object.prototype.hasOwnProperty.call(uxRBAC().roles[mTenant]||{},x.role)))throw Error('请选择当前企业已有角色');}
if(kind==='rules'){['name','owner','notification'].forEach(text);if(!['未知成本','回传异常','待确认时长','返工'].includes(x.type))throw Error('规则类型无效');x.threshold=mOptional(String(x.threshold),'阈值');x.deadlineHours=mOptional(String(x.deadlineHours),'期限');if(x.threshold===null||x.deadlineHours===null||x.deadlineHours<1)throw Error('阈值 / 期限无效');x.enabled=!!x.enabled;}return x;}
function mSaveConfig(kind,id,data){return mTx(uxActionPermission(kind),()=>{if(!['agents','integrations','baselines','members','rules'].includes(kind))throw Error('未知配置');const old=management[kind].find(x=>x.id===id&&mScope(x));if(id&&!old)throw Error('对象不在当前范围');const x=mValidateConfig(kind,{...mCopy(data),id:old?.id||uid(),tenant:mTenant,version:(old?.version||0)+1,history:mCopy(old?.history||[])});if(old)x.history.push({...mCopy(old),history:undefined,at:mNow()});if(kind==='baselines'&&old&&old.state!=='草稿'){x.id=uid();management[kind].push(x);}else if(old)management[kind][management[kind].indexOf(old)]=x;else management[kind].push(x);return x.id;});}

function mBaselineAction(id,action){mTx('baseline.write',()=>{const b=management.baselines.find(x=>x.id===id&&mScope(x));if(!b)throw Error('基线不在当前范围');const next=action==='提交审核'?'待审核':action==='发布'?'已发布':'已废弃';if(action==='提交审核'&&b.state!=='草稿'||action==='发布'&&b.state!=='待审核'||action==='废弃'&&!['已发布','待审核','草稿'].includes(b.state))throw Error('基线状态不允许此动作');b.history.push({...mCopy(b),history:undefined,at:mNow()});b.state=next;b.reviewer=action==='发布'?'本地管理员审核（演示）':b.reviewer;b.publishedAt=action==='发布'?mNow():b.publishedAt;});render();}

function mEventDialog(){mSafe(()=>{mRequire('admin');modal('受控宿主事件导入',`<p>这是宿主事件 JSON 导入，不提供业务确认按钮。来源用户、来源授权、事件 ID、版本和 Task 关联都在本地校验。先在企业集成完成检测并连接。</p><p>支持 task.created / attempt.recorded / user.verdict / task.status；事件版本须按 Task 连续递增。重复 ID 相同内容幂等，冲突拒绝，整批原子回滚。传输失败保留来源用户判定。</p><textarea id="m-event" aria-label="宿主事件 JSON" style="width:100%;min-height:330px">${esc(JSON.stringify(mEventSample(),null,2))}</textarea>`,btn('契约','integrationContract()')+btn('取消','closeModal()')+mButton('导入事件',"mSafe(()=>{mImportEvents(JSON.parse(val('m-event')));closeModal();render();toast('来源事件已校验接收')})"),true);});}
function mImportEvents(raw){const list=Array.isArray(raw)?raw:[raw];if(!list.length||list.length>1000)throw Error('事件数量 1–1000');return mTx('admin',()=>{let count=0;for(const input of list){const e=mCopy(input);const sourceConfig=management.integrations.find(i=>i.tenant===e.tenant&&i.source===e.source);if(sourceConfig){for(const [canonical,key] of [['externalTaskId','task'],['agentIds','agent'],['sourceUser','user']]){const mapped=sourceConfig.mapping[key];if(e[canonical]===undefined&&mapped&&e[mapped]!==undefined)e[canonical]=mCopy(e[mapped]);}}['eventId','tenant','source','taskId','externalTaskId','sourceUser','at','scope'].forEach(k=>validText(e[k],k,500));if(!Number.isFinite(Date.parse(e.at)))throw Error('事件时间无效');if(e.tenant!==mTenant)throw Error('跨租户事件被拒绝');const i=management.integrations.find(i=>i.tenant===e.tenant&&i.source===e.source);if(!i||!i.connected||i.health!=='检测通过')throw Error('来源未通过本地检测或已断连');if(!i.users.includes(e.sourceUser)||!i.scopes.includes(e.scope))throw Error('来源用户或业务范围未授权');if(!['task.created','attempt.recorded','user.verdict','task.status'].includes(e.type)||!Number.isInteger(e.version)||e.version<1)throw Error('事件类型 / 版本无效');const key=[e.tenant,e.source,e.eventId].join('|'),prior=management.receipts.find(r=>r.key===key);if(prior){if(JSON.stringify(prior.event)!==JSON.stringify(e))throw Error('重复事件 ID 内容冲突');continue;}let t=management.tasks.find(t=>t.id===e.taskId);if(t&&(!mScope(t)||t.tenant!==e.tenant||t.source!==e.source||t.externalId!==e.externalTaskId||t.anchor!==e.scope))throw Error('Task / 外部关联 / 范围冲突');if(e.type==='task.created'){if(t||e.version!==1||management.tasks.some(t=>t.tenant===e.tenant&&t.source===e.source&&t.externalId===e.externalTaskId))throw Error('创建 ID / 外部 ID / 版本冲突');validText(e.name,'意图');if(!Number.isInteger(e.intentVersion)||e.intentVersion<1)throw Error('意图版本无效');validText(e.standard,'标准');validText(e.quality,'质量要求');validText(e.team,'团队');if(mTeam!=='全部'&&e.team!==mTeam)throw Error('创建团队越权');t={id:e.taskId,name:e.name,tenant:e.tenant,team:e.team,anchor:e.scope,source:e.source,externalId:e.externalTaskId,owner:e.sourceUser,sourceUser:e.sourceUser,employee:'映射待补齐',state:'执行中',risk:e.risk||'中',intentVersion:e.intentVersion,standard:e.standard,quality:e.quality,version:0,verdict:'待确认',transport:'待回传',created:e.at,permission:{user:e.sourceUser,scope:e.scope,authorized:true},snapshot:{content:'暂无成果',missing:['成果快照']},attemptRecords:[],costs:['模型','工具','评测','人工交办审核','失败返工补救'].map((kind,j)=>({id:'C'+j,kind,amount:null,minutes:null,rate:null,evidence:'未知',history:[]})),events:[],trace:null};management.tasks.push(t);}else{if(!t)throw Error('Task 关联不存在');if(e.version!==t.version+1||e.intentVersion!==t.intentVersion||e.standard!==t.standard)throw Error('Task / 意图 / 标准版本冲突');}
if(e.type==='attempt.recorded'){if(!Array.isArray(e.agentIds)||!e.agentIds.length||e.agentIds.some(id=>!management.agents.some(a=>a.id===id&&a.tenant===e.tenant&&a.enabled)))throw Error('Agent 映射不存在或停用');validText(e.attemptId,'Attempt');validText(e.executionVersion,'执行版本');validText(e.run,'运行 ID');if(t.attemptRecords.some(a=>a.id===e.attemptId))throw Error('Attempt 重复，需新执行尝试');if(!['执行中','待验收','执行失败','返工中'].includes(e.state)||['已闭环','已取消'].includes(t.state))throw Error('Attempt 状态不允许');if(!e.snapshot||typeof e.snapshot.content!=='string'||!Array.isArray(e.snapshot.missing))throw Error('缺少结构成果快照 / 缺失字段');t.attemptRecords.push({id:e.attemptId,agentIds:e.agentIds,version:e.executionVersion,run:e.run,state:e.state,snapshot:mCopy(e.snapshot)});t.snapshot=mCopy(e.snapshot);t.state=e.state;t.employee=e.agentIds.map(id=>management.agents.find(a=>a.id===id).name).join(' / ');t.artifact=e.snapshot.title||'本地结构成果';}
if(e.type==='user.verdict'){if(!i.capabilities.includes('用户判定'))throw Error('来源未启用用户判定能力');if(!['通过','返工'].includes(e.verdict)||!['已接收','失败','待回传'].includes(e.transport)||!Number.isInteger(e.verdictVersion)||e.verdictVersion!==(t.verdictVersion||0)+1)throw Error('用户判定 / 传输 / 判定版本无效');if(!['待验收','返工中','已闭环'].includes(t.state)||!t.attemptRecords.length)throw Error('尚无可判定成果或状态非法');validText(e.evidence,'来源判定证据');t.verdict=e.verdict;t.verdictVersion=e.verdictVersion;t.sourceUser=e.sourceUser;t.transport=e.transport;t.verdictEvidence={eventId:e.eventId,user:e.sourceUser,at:e.at,evidence:e.evidence,version:e.verdictVersion};t.state=e.verdict==='通过'?'已闭环':'返工中';}
if(e.type==='task.status'){const transitions={'执行中':['待验收','执行失败','已取消'],'执行失败':['执行中','已取消'],'待验收':['已取消'],'返工中':['执行中','待验收','执行失败','已取消'],'已闭环':[],'已取消':[]};if(!transitions[t.state].includes(e.state))throw Error('非法状态迁移，闭环仅来源用户判定可触发');t.state=e.state;}
t.version=e.version;t.updated=e.at;t.events.push(mCopy(e));management.receipts.push({key,event:e,tenant:e.tenant,taskId:t.id,transport:t.transport,receivedAt:mNow(),retries:0});count++;}return count;});}
settingsPage=function(){return title('企业集成','本地配置向导、来源授权、健康检测、断连重试与对账。真实网络接入尚未实现。',mButton('可选 Trace 采集配置','QualityOnline.configDialog()')+mButton('配置向导','mWizard()')+mButton('宿主事件导入','mEventDialog()')+btn('事件契约','integrationContract()'))+mBanner()+`<div class="employee-grid">${management.integrations.filter(mScope).map(i=>`<div class="card card-body"><h2>${esc(i.source)}</h2><p>${esc(i.tenant)} · 步骤 ${i.step}/6 · ${i.connected?'已连接（模拟）':'断连'} · ${esc(i.health)}</p><p>能力覆盖：${i.capabilities.map(esc).join(' / ')}；Trace 可选。</p>${mJSON(mSensitive({...i,history:undefined}))}<div class="actions">${mButton('继续向导',`mWizard(${jsarg(i.id)})`)}${mButton('接入检测',`mSafe(()=>mConnection(${jsarg(i.id)},'检测'))`)}${mButton(i.connected?'断连':'重连',`mSafe(()=>mConnection(${jsarg(i.id)},${jsarg(i.connected?'断连':'重连')}))`)}${mButton('本地对账 / 重试',`mSafe(()=>mReconcile(${jsarg(i.id)}))`)}</div><details><summary>配置与连接历史</summary>${mJSON(i.history)}</details></div>`).join('')||'<div class="empty">暂无来源；先完成配置向导。</div>'}</div><div class="card card-body"><h2>接收队列 / 传输异常</h2>${mJSON(management.receipts.filter(mScope).map(r=>({key:r.key,taskId:r.taskId,transport:r.transport,retries:r.retries,receivedAt:r.receivedAt})))}</div>`;};
let mWizardDraft=null,mWizardId='',mWizardStep=1;
function mWizard(id){mSafe(()=>{mRequire('admin');const i=management.integrations.find(i=>i.id===id&&mScope(i));if(id&&!i)throw Error('集成不在范围');mWizardDraft=mCopy(i||mTemplate('integrations'));mWizardId=id||'';mWizardStep=1;mWizardRender();});}
function mWizardRender(){const d=mWizardDraft,steps=['来源','租户与身份范围','字段映射','回传入口','能力选择','接入检测（本地模拟）'];let body=`<p>步骤 ${mWizardStep}/6：${steps[mWizardStep-1]}</p>`;if(mWizardStep===1)body+=field('来源应用','mw-source',d.source);if(mWizardStep===2)body+=`<p>企业租户：${esc(mTenant)}（当前角色范围）</p>`+field('来源用户（逗号分隔）','mw-users',d.users.join(','))+field('授权业务范围（逗号分隔）','mw-scopes',d.scopes.join(','));if(mWizardStep===3)body+=['task','agent','user'].map(k=>field(k+' 字段','mw-'+k,d.mapping[k])).join('');if(mWizardStep===4)body+=field('回传入口（仅 local://）','mw-entry',d.entry);if(mWizardStep===5)body+=['任务事件','用户判定','成本','Trace'].map(c=>`<label><input type="checkbox" id="mw-cap-${c}" ${d.capabilities.includes(c)?'checked':''}>${c}</label> `).join('');if(mWizardStep===6)body+=`<p>将校验字段映射、用户授权和入口，并保存本地配置。检测不连接真实服务。保存后执行“接入检测”和“重连”。</p>${mJSON(d)}`;modal('企业集成向导',body,btn('取消','closeModal()')+(mWizardStep>1?btn('上一步','mWizardStep--;mWizardRender()'):'')+mButton(mWizardStep===6?'保存配置':'下一步','mSafe(()=>mWizardNext())'),true);}
function mWizardNext(){const d=mWizardDraft;if(mWizardStep===1)d.source=validText(val('mw-source'),'来源');if(mWizardStep===2){d.users=val('mw-users').split(',').map(s=>s.trim()).filter(Boolean);d.scopes=val('mw-scopes').split(',').map(s=>s.trim()).filter(Boolean);if(!d.users.length||!d.scopes.length)throw Error('用户与范围不能为空');}if(mWizardStep===3)for(const k of ['task','agent','user'])d.mapping[k]=validText(val('mw-'+k),k);if(mWizardStep===4){d.entry=val('mw-entry');if(!d.entry.startsWith('local://'))throw Error('只允许本地模拟入口');}if(mWizardStep===5){d.capabilities=['任务事件','用户判定','成本','Trace'].filter(c=>document.getElementById('mw-cap-'+c).checked);if(!d.capabilities.includes('任务事件'))throw Error('必须选择任务事件');}if(mWizardStep===6){d.step=6;d.connected=false;d.health='未检测';mSaveConfig('integrations',mWizardId,d);closeModal();render();}else{mWizardStep++;mWizardRender();}}
function mConnection(id,action){mTx('admin',()=>{const i=management.integrations.find(x=>x.id===id&&mScope(x));if(!i)throw Error('来源不在范围');i.history.push({...mCopy(i),history:undefined,at:mNow(),action});if(action==='检测'){mValidateConfig('integrations',i);if(i.step!==6)throw Error('先完成向导');i.health='检测通过';}if(action==='断连')i.connected=false;if(action==='重连'){if(i.health!=='检测通过')throw Error('先执行接入检测');i.connected=true;}});render();}
function mReconcile(id){mTx('admin',()=>{const i=management.integrations.find(x=>x.id===id&&mScope(x));if(!i||!i.connected||i.health!=='检测通过')throw Error('需检测通过并连接');for(const r of management.receipts.filter(r=>r.tenant===i.tenant&&r.event.source===i.source)){const t=mTask(r.taskId);if(r.transport==='失败'){r.retries++;r.transport='已接收';r.retryAt=mNow();t.transport='已接收';t.events.push({id:uid(),type:'本地传输重试成功',at:mNow(),related:r.key});}}i.history.push({action:'本地对账完成',at:mNow(),facts:'传输状态修复，不改来源用户判定'});});render();}

let mRestorePack=null;
function mCheckBackup(pack){if(pack.schema!=='task-backup-2'||!pack.prototype||!pack.stores||Object.keys(pack.stores).some(k=>!mBackupKeys.includes(k)))throw Error('备份契约不合法');mValidate(pack.management);for(const key of mBackupKeys){const v=pack.stores[key];if(v!==null&&typeof v!=='string')throw Error('备份存储必须是原始 JSON 或 null');if(v!==null){const parsed=JSON.parse(v);if(key===STORE)validateStore(parsed);else if(globalThis.QualityOnline)QualityOnline.validateStorage(parsed);else if(!parsed||typeof parsed!=='object')throw Error('在线模块备份无效');}}return pack;}

function mApplyRestore(){mRequire('governance.write');if(!mSystem||!mRestorePack)throw Error('没有通过校验的系统备份');const pack=mCheckBackup(mRestorePack),keys=[MGKEY,...mBackupKeys],before={};for(const key of keys)before[key]=localStorage.getItem(key);try{localStorage.setItem(MGKEY,JSON.stringify(pack.management));for(const key of mBackupKeys){if(pack.stores[key]===null)localStorage.removeItem(key);else localStorage.setItem(key,pack.stores[key]);}}catch(e){let failed=false;for(const key of keys)try{if(before[key]===null)localStorage.removeItem(key);else localStorage.setItem(key,before[key]);}catch(_){failed=true;}throw Error('恢复保存失败；'+(failed?'部分存储回滚失败，需使用事前备份恢复':'旧存储已回滚')+'：'+e.message);}management=mCopy(pack.management);quality=pack.stores[STORE]!==null?validateStore(JSON.parse(pack.stores[STORE])):seedQuality();if(globalThis.QualityOnline)QualityOnline.reload();mSync();closeModal();render();toast('恢复成功；刷新页面使在线模块重新读取存储');}
observePage=function(){return title('任务观测','本地规则与信号处置；质量信号统一汇入接口已预留。',mButton('新增规则',"mEditConfig('rules')",'rule')+mButton('运行本地规则','mSafe(()=>mRunRules())','rule'))+mBanner()+`<div class="card card-body"><h2>真实本地规则</h2>${management.rules.filter(mScope).map(r=>`<p>${esc(r.name)} · ${esc(r.type)} ≥ ${r.threshold} · ${esc(r.owner)} · ${r.deadlineHours} h · ${esc(r.notification)} · ${r.enabled?'启用':'停用'} ${mButton('编辑',`mEditConfig('rules',${jsarg(r.id)})`,'rule')}${mButton('删除 / 恢复',`mSafe(()=>mDeleteRule(${jsarg(r.id)}))`,'rule')}<details><summary>历史</summary>${mJSON(r.history)}</details></p>`).join('')||'<p>暂无规则</p>'}</div><div class="card card-body"><h2>信号与处置</h2>${management.signals.filter(mScope).map(s=>`<div class="section"><h3>${esc(s.reason)} · ${esc(s.state)}</h3><p>${esc(s.taskId)} · 负责人 ${esc(s.owner)} · 期限 ${esc(s.due)} · ${Date.parse(s.due)<Date.now()&&s.state!=='已关闭'?'已逾期':'期限内 / 已关闭'} · 复发 ${esc(s.recurrence||'无')}</p>${mButton('调查 / 复核 / 关闭',`mSignalDialog(${jsarg(s.id)})`,'signal')}<details><summary>处置记录</summary>${mJSON(s)}</details></div>`).join('')||'<div class="empty">暂无信号。运行本地规则或通过统一接口导入质量信号。</div>'}</div>`;};

function mSignalAdd(data){const t=mTask(data.taskId);validText(data.eventId,'信号事件 ID');validText(data.reason,'信号原因');const old=management.signals.find(s=>s.tenant===mTenant&&s.eventId===data.eventId);if(old){if(old.reason!==data.reason||old.taskId!==data.taskId)throw Error('信号 ID 冲突');return old.id;}const recurrence=management.signals.filter(s=>s.tenant===mTenant&&s.taskId===t.id&&s.reason===data.reason&&s.state==='已关闭').slice(-1)[0];const s={id:uid(),tenant:mTenant,team:t.team,eventId:data.eventId,taskId:t.id,source:data.source||'本地规则',reason:data.reason,owner:validText(data.owner||t.owner,'负责人'),due:new Date(Date.now()+(data.deadlineHours||24)*3600000).toISOString(),state:'待调查',recurrence:recurrence?.id||'',evidence:data.evidence||'无附加证据',records:[]};management.signals.push(s);return s.id;}

function mSignalDialog(id){mSafe(()=>{mRequire('signal');const s=management.signals.find(x=>x.id===id&&mScope(x));if(!s)throw Error('信号不在当前范围');modal('信号处置',`<p>业务任务状态保持原事实，处置仅更新观测记录。</p>${field('调查 / 复核说明与证据（必填）','ms-note','','textarea')}<select id="ms-state">${options(['调查中','待复核','已关闭'],s.state)}</select>`,btn('取消','closeModal()')+mButton('记录',`mSafe(()=>mSaveSignal(${jsarg(id)}))`,'signal'));});}

const TaskManagement={version:'2',getTasks:()=>mCopy(management.tasks.filter(mScope)),getContext:()=>({tenant:mTenant,team:mTeam,role:mRole}),importHostEvents:raw=>mImportEvents(raw),ingestQualitySignal:data=>mTx('signal',()=>mSignalAdd(data)),attachTrace:(taskId,attemptId,trace)=>mTx('admin',()=>{const t=mTask(taskId);if(!t.attemptRecords.some(a=>a.id===attemptId))throw Error('Attempt 关联不存在');if(!trace||trace.tenant!==t.tenant||trace.taskId!==taskId||trace.attemptId!==attemptId)throw Error('Trace 租户 / Task / Attempt 不匹配');t.trace=mCopy(trace);t.events.push({id:uid(),type:'可选 Trace 证据关联',at:mNow(),attemptId});}),recordEvaluationCost:(taskId,jobId,amount,evidence)=>mTx('cost',()=>{const t=mTask(taskId);validText(jobId,'评测作业 ID');const n=mOptional(String(amount),'评测成本');if(n===null)throw Error('没有账单证据时请保留未知');const id='evaluation:'+jobId,old=t.costs.find(c=>c.id===id);if(old){if(old.amount!==n||old.evidence!==evidence)throw Error('评测作业成本冲突，需成本页纠错');return;}t.costs.push({id,kind:'评测执行',amount:n,minutes:null,rate:null,evidence:validText(evidence,'成本证据'),history:[]});})};

/* Load after the host's inline scripts, then QualityGovernance.install(bridge).
 * Host hooks: tenant string/function (legacy seeds belong to demo), authorize(action,
 * {tenant,actor}) must return true synchronously, actor string/function,
 * agents() => [{id,versions:[string]}]. Main owns SSO, tenant scope, permissions,
 * observation dispositions and business events. No Task writes or connector execution.
 * Online: install the same tenant/authorize bridge; taskTrace(taskId) is optional

 * signals/openObservation bridge belong to main observation. No auto-install.

(function(root){
'use strict';

function assign(reviewId,assignee){return mutate('quality.review.assign',g=>{const r=requireOwn(g.reviews.find(x=>x.id===reviewId));if(r.state!=='待独立复核')throw Error('复核已完成');r.assignee=str(assignee,'复核人');if(bridge.actors&&!bridge.actors().includes(r.assignee))throw Error('请选择已登记的复核身份');if(r.assignee===r.submitter)throw Error('不能分派给标注提交人');audit(g,'review-assign',r.id,{assignee:r.assignee});});}
function review(reviewId,label,reason){return mutate('quality.review.submit',g=>{const r=requireOwn(g.reviews.find(x=>x.id===reviewId));if(r.state!=='待独立复核'||!r.assignee||r.assignee!==actor()||r.submitter===actor())throw Error('需由已分派的独立复核人提交');if(!['通过','不通过'].includes(label))throw Error('标签无效');const d=requireOwn(findSet(r.setId)),s=d.samples.find(x=>x.id===r.sampleId);if(!s||JSON.stringify(s)!==JSON.stringify(r.inputSnapshot))throw Error('草稿已变更，重新提交标注');r.verdict=label;r.reviewReason=str(reason,'独立证据');r.reviewer=actor();r.state=label===r.proposed?'已复核':'分歧待仲裁';r.completed=stamp();if(r.state==='已复核'){s.reference=label;s.labelAudit={reviewId:r.id,reviewer:actor(),at:stamp(),reason:r.reviewReason};}audit(g,'independent-review',s.id,r);});}
function arbitrate(reviewId,label,reason){return mutate('quality.review.arbitrate',g=>{const r=requireOwn(g.reviews.find(x=>x.id===reviewId));if(r.state!=='分歧待仲裁'||[r.submitter,r.reviewer].includes(actor()))throw Error('需第三方独立仲裁人');if(!['通过','不通过'].includes(label))throw Error('标签无效');const d=requireOwn(findSet(r.setId)),s=d.samples.find(s=>s.id===r.sampleId);if(!s||JSON.stringify(s)!==JSON.stringify(r.inputSnapshot))throw Error('样本变更需重新标注');r.arbitration={actor:actor(),label,reason:str(reason),at:stamp()};r.state='已仲裁';s.reference=label;s.labelAudit={reviewId:r.id,reviewer:actor(),reason:r.arbitration.reason,at:stamp()};audit(g,'review-arbitration',s.id,r);});}
function publish(id){return mutate('quality.dataset.publish',g=>{const d=requireOwn(findSet(id)),m=setMeta(id);if(m.sourceReview!=='通过'||!m.authorization||!m.owner||!m.standard||!m.deduplicated)throw Error('先完成来源/授权/去重/标准/owner治理');if(!d.samples.length||d.samples.some(s=>!s.labelAudit||s.reference==='待标注'))throw Error('草稿样本均需独立复核；历史用户验收不自动成为真值');if(g.reviews.some(r=>r.setId===id&&['待独立复核','分歧待仲裁'].includes(r.state)))throw Error('存在未解决复核');const v={number:Math.max(0,...d.versions.map(v=>v.number))+1,at:stamp(),name:d.name,description:d.description,standard:m.standard,governance:C(m),samples:C(d.samples)};d.versions.push(v);audit(g,'immutable-publish',id,{number:v.number});return v.number;});}
function historicalAudit(id,version,sampleId,note){return mutate('quality.dataset.audit',g=>{const d=requireOwn(findSet(id)),v=d.versions.find(v=>v.number===version);if(!v?.samples.some(s=>s.id===sampleId))throw Error('历史样本不存在');audit(g,'historical-label',id,{version,sampleId,note:str(note,'历史标签审计'),classification:'历史标签未重新证明独立真值'});});}
function saveEvaluator(id,m){return mutate('quality.evaluator.govern',g=>{requireOwn(findEval(id));const rubric=Array.isArray(m.rubric)?m.rubric:[];if(!rubric.length||rubric.some(r=>!r.dimension||!r.criteria))throw Error('填写业务维度与判定rubric');if(m.replacement){requireOwn(findEval(m.replacement));if(m.replacement===id)throw Error('不能替代自身');}const links=m.calibration||[];links.forEach(x=>{const e=requireOwn(findExp(x));if(e.evalRef.split(':')[0]!==id||e.kind!=='判定校准'||e.state!=='已完成')throw Error('校准关联需已完成判定校准实验');});g.evaluators[id]={rubric:rubric.map(r=>({dimension:str(r.dimension),criteria:str(r.criteria)})),scope:str(m.scope,'适用范围'),enabled:m.enabled!==false,replacement:m.replacement||null,calibration:C(links),at:stamp()};audit(g,'evaluator-governance',id,g.evaluators[id]);});}
function dependencies(id){requireOwn(findEval(id));return quality.experiments.filter(own).filter(e=>e.evalRef.split(':')[0]===id||JSON.stringify(e.evaluator).includes(id+':')).map(e=>({id:e.id,name:e.name,evalRef:e.evalRef}));}
function evaluate(sample,e){try{if(!sample.actual||!sample.expected||(e.type==='人工参考'&&sample.reference==='待标注'))return {status:'insufficient_evidence',score:null,pass:null,reason:'缺少输入或输出证据'};const r=scoreSample(sample,e);return {...r,status:r.pass===null?(r.reason.includes('参考')?'insufficient_evidence':'out_of_scope'):r.pass?'passed':'failed',simulation:true};}catch(err){return {status:'error',score:null,pass:null,reason:err.message,simulation:true};}}
function configureRun(id,c){return mutate('quality.experiment.configure',g=>{const e=requireOwn(findExp(id));const agents=bridge.agents?bridge.agents():[];if(agents.length&&!agents.some(a=>a.id===c.agentId&&a.versions.includes(c.agentVersion)))throw Error('目标需已登记Agent与版本');if(!agents.length&&!tasks.some(t=>t.employee===c.agentId))throw Error('请选择已有Agent资产名称');const maxAttempts=number(c.maxAttempts,1,10);if(!Number.isInteger(maxAttempts))throw Error('最大尝试需整数');const old=g.experiments[id];if(old?.runs?.length)throw Error('已有执行记录，配置冻结');g.experiments[id]={config:{agentId:str(c.agentId),agentVersion:str(c.agentVersion),budget:number(c.budget,0.01,100000),maxAttempts},samples:C(e.samples),dataRef:e.dataRef,evalRef:e.evalRef,evaluator:freezeEvaluator(e.evaluator),runs:[],conclusion:null};audit(g,'run-config',id,g.experiments[id].config);});}
function runSample(id,sampleId,options={}){return mutate('quality.experiment.run',g=>{const e=requireOwn(findExp(id)),x=g.experiments[id];if(!x?.config)throw Error('先保存运行配置');const s=x.samples.find(s=>s.id===sampleId);if(!s)throw Error('样本不在冻结版本');const prior=x.runs.filter(r=>r.sampleId===sampleId);if(prior.length>=x.config.maxAttempts||prior.at(-1)?.status==='completed')throw Error('尝试上限或样本已完成');const spent=x.runs.reduce((n,r)=>n+r.cost,0),cost=options.cost===undefined?.05:number(options.cost,0,100000);if(spent+cost>x.config.budget)throw Error('预算不足');const output=options.output===undefined?s.actual:str(options.output,'输出证据');const row={sampleId,attempt:prior.length+1,at:stamp(),simulation:true,input:C(s),output,intervention:options.intervention?{actor:actor(),note:str(options.intervention),minutes:options.minutes===undefined?null:number(options.minutes,0,100000)}:null,cost,status:options.fail?'failed':'completed',result:options.fail?{status:'error',score:null,pass:null,reason:'离线模拟失败'}:evaluate({...s,actual:output},x.evaluator)};x.runs.push(row);audit(g,'sample-execution',id,row);return row;});}
function investment(id){requireOwn(findExp(id));const x=governance().experiments[id];if(!x)return {cost:null,minutes:null};return {cost:x.externalResults?(x.externalResults.some(r=>r.cost===null)?null:x.externalResults.reduce((n,r)=>n+r.cost,0)):(x.runs.length?x.runs.reduce((n,r)=>n+r.cost,0):null),minutes:x.runs.some(r=>r.intervention&&r.intervention.minutes==null)?null:x.runs.reduce((n,r)=>n+(r.intervention?.minutes||0),0),attempts:x.runs.length};}
function importResults(id,raw){if(typeof raw!=='string'||raw.length>2000000)throw Error('JSON限2MB');const p=JSON.parse(raw);return mutate('quality.experiment.import',g=>{const e=requireOwn(findExp(id)),x=g.experiments[id];if(!x)throw Error('先冻结运行配置');if(p.dataRef!==e.dataRef||p.evalRef!==e.evalRef||JSON.stringify(p.samples)!==JSON.stringify(x.samples))throw Error('外部结果必须匹配全部冻结样本、数据和标准');if(!Array.isArray(p.rows)||p.rows.length!==x.samples.length||new Set(p.rows.map(r=>r.sampleId)).size!==x.samples.length)throw Error('逐样本结果需完整且无重复');const rows=p.rows.map(r=>{const s=x.samples.find(s=>s.id===r.sampleId);if(!s||!['completed','failed'].includes(r.status))throw Error('未知样本或状态');const output=str(r.output,'外部输出证据'),cost=r.cost==null?null:number(r.cost,0,100000);return {sampleId:r.sampleId,status:r.status,input:C(s),output,cost,result:r.status==='failed'?{status:'error',score:null,pass:null}:evaluate({...s,actual:output},x.evaluator),external:true,at:stamp(),source:str(p.source,'外部成果来源')};});x.externalResults=rows;audit(g,'external-results-import',id,{source:p.source,count:rows.length});return rows;});}
function conclude(id,text,followup){return mutate('quality.experiment.conclusion',g=>{requireOwn(findExp(id));const x=g.experiments[id];if(!x||!x.samples.every(s=>x.runs.some(r=>r.sampleId===s.id&&r.status==='completed')||x.externalResults?.some(r=>r.sampleId===s.id&&r.status==='completed')))throw Error('所有冻结样本需完成');if(followup){const other=requireOwn(findExp(followup));if(other.id===id)throw Error('后续验证不能指向自身');}x.conclusion={text:str(text,'结论'),followup:followup||null,state:'待质量审核',submitter:actor(),at:stamp()};audit(g,'conclusion-submit',id,x.conclusion);});}
function reviewConclusion(id,decision,reason){return mutate('quality.experiment.review',g=>{requireOwn(findExp(id));const c=g.experiments[id]?.conclusion;if(!c||c.state!=='待质量审核'||c.submitter===actor())throw Error('需独立质量审核人');if(!['通过','退回'].includes(decision))throw Error('审核结果无效');c.state=decision;c.reviewer=actor();c.reason=str(reason);audit(g,'conclusion-review',id,c);});}

function muSignalDetail(id){mSafe(()=>{const s=management.signals.find(x=>x.id===id&&mScope(x));if(!s)throw Error('信号不在当前范围');const next={'待调查':['调查中'],'调查中':['调查中','待复核'],'待复核':['调查中','已关闭'],'已关闭':[]}[s.state]||[];detailPage('信号详情 · '+s.reason,`<div class="card card-body"><h2>${esc(s.state)} · ${esc(s.taskId)}</h2><p>来源 ${esc(s.source)} · 负责人 ${esc(s.owner)} · 期限 ${esc(s.due)}</p>${s.recurrence?`<p>历史复发记录 ${btn('查看',`muSignalDetail(${jsarg(s.recurrence)})`)}</p>`:''}<h3>触发证据</h3>${mJSON(mSensitive(s.evidence))}${btn('关联任务',`openTask(${jsarg(s.taskId)})`)}</div><div class="card card-body"><h2>处置时间线</h2>${muTable(['时间','操作人','状态变化','证据说明'],s.records.map(r=>`<tr><td>${esc(r.at)}</td><td>${esc(r.actor)}</td><td>${esc(r.from+' → '+r.to)}</td><td>${esc(r.note)}</td></tr>`),'尚无处置记录。')}${next.length?`<h3>追加处置记录</h3>${field('调查 / 复核说明与证据（必填）','ms-note','','textarea')}<label>下一状态<select id="ms-state">${options(next,next[0])}</select></label>${mButton('保存处置',`mSafe(()=>muSaveSignal(${jsarg(id)}))`,'signal')}`:'<p>已关闭信号保留历史，新异常会产生复发记录。</p>'}</div>`,btn('返回任务观测',"navigate('observe')"));});}
function muSaveSignal(id){const note=validText(val('ms-note'),'证据说明'),state=val('ms-state');mTx('signal',()=>{const s=management.signals.find(x=>x.id===id&&mScope(x));if(!s)throw Error('信号不在范围');const next={'待调查':['调查中'],'调查中':['调查中','待复核'],'待复核':['调查中','已关闭'],'已关闭':[]}[s.state]||[];if(!next.includes(state))throw Error('请按调查、提交复核、关闭流程处理');const submit=s.records.filter(r=>r.to==='待复核').slice(-1)[0];if(state==='已关闭'&&submit?.actor===mActor)throw Error('提交调查者不能复核关闭，请切换独立操作人');s.records.push({at:mNow(),actor:mActor,from:s.state,to:state,note});s.state=state;});muSignalDetail(id);toast('处置记录已保存');}
mSignalDialog=muSignalDetail;
function muIntegrationReceipts(i){return management.receipts.filter(mScope).filter(r=>!i||r.event.source===i.source).filter(r=>muReceiptFilter==='全部'||r.transport===muReceiptFilter);}
function muReceiptTable(rows){return muTable(['事件 / 来源','关联任务','传输','重试次数','接收时间'],rows.map(r=>`<tr><td>${esc(r.event.eventId||r.key)}<br>${esc(r.event.source)} · ${esc(r.event.type)}</td><td>${btn(r.taskId,`openTask(${jsarg(r.taskId)})`)}</td><td>${esc(r.transport)}</td><td>${esc(r.retries)}</td><td>${esc(r.receivedAt)}</td></tr>`));}
settingsPage=function(){const items=management.integrations.filter(mScope);return title('企业集成','接入业务宿主的任务事件、执行成果、用户验收和成本；Trace 是可选执行证据。',mButton('新增来源','mWizard()')+mButton('导入宿主事件','mEventDialog()')+btn('查看事件契约','integrationContract()'))+mBanner()+`<div class="card card-body"><h2>集成什么，如何集成</h2><p>业务宿主包括交办任务的业务系统、Agent 工作台或自动化应用。平台统一展示任务生命周期和投入；业务用户继续在宿主验收。</p><ol><li>登记来源应用、当前企业、来源用户和业务范围。</li><li>映射外部任务、Agent 与用户字段，登记回传入口及需要的能力。</li><li>完成本地配置校验并启用来源，导入事件验证关联、版本顺序和幂等去重。</li><li>在来源详情检查接收队列、失败事件和映射；真实连接需后端接入服务。</li></ol><div class="notice">当前支持受控 JSON 事件导入和本地契约校验；连接状态表示本地允许接收，未建立网络连接。local:// 入口不是生产 API。</div></div><div class="employee-grid">${items.map(i=>`<div class="card card-body"><h2>${esc(i.source)}</h2><p>${esc(i.tenant)} · ${i.connected?'本地接收已启用':'本地接收已停用'} · ${esc(i.health)}</p><p>能力：${i.capabilities.map(esc).join(' / ')}</p><p>授权用户 ${i.users.length} · 业务范围 ${i.scopes.length} · 接收事件 ${management.receipts.filter(mScope).filter(r=>r.event.source===i.source).length}</p>${btn('来源详情',`muIntegrationDetail(${jsarg(i.id)})`)}${mButton('配置',`mWizard(${jsarg(i.id)})`)}</div>`).join('')||'<div class="empty">尚无接入来源，点击“新增来源”完成配置。</div>'}</div><div class="card card-body"><h2>事件接收队列</h2><label>传输状态<select onchange="muReceiptFilter=this.value;render()">${options(['全部','已接收','失败','待回传'],muReceiptFilter)}</select></label>${muReceiptTable(muIntegrationReceipts())}</div>`;};
function muIntegrationDetail(id){mSafe(()=>{const i=management.integrations.find(x=>x.id===id&&mScope(x));if(!i)throw Error('来源不在范围');detailPage('企业集成 · '+i.source,`<div class="card card-body"><h2>接入配置与授权</h2><p>${esc(i.tenant)} · 步骤 ${i.step}/6 · ${esc(i.health)} · ${i.connected?'本地接收已启用':'本地接收已停用'}</p><p>来源用户：${i.users.map(esc).join('、')}<br>业务范围：${i.scopes.map(esc).join('、')}<br>回传入口：${esc(i.entry)}</p>${muTable(['平台字段','宿主字段'],Object.entries(i.mapping).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`))}<p>能力 ${i.capabilities.map(esc).join(' / ')}</p><div class="actions">${mButton('配置向导',`mWizard(${jsarg(id)})`)}${mButton('本地配置校验',`mSafe(()=>{mConnection(${jsarg(id)},'检测');muIntegrationDetail(${jsarg(id)})})`)}${mButton(i.connected?'停用本地接收':'启用本地接收',`mSafe(()=>{mConnection(${jsarg(id)},${jsarg(i.connected?'断连':'重连')});muIntegrationDetail(${jsarg(id)})})`)}${mButton('本地对账 / 重试',`mSafe(()=>{mReconcile(${jsarg(id)});muIntegrationDetail(${jsarg(id)})})`)}</div><p>本地重试仅修复原型传输记录，不代表真实网络投递。</p></div><div class="card card-body"><h2>此来源接收队列</h2>${muReceiptTable(muIntegrationReceipts(i))}</div><div class="card card-body"><h2>配置历史</h2>${mJSON(mSensitive(i.history))}</div>`,btn('返回企业集成',"navigate('settings')"));});}
analysisPage=function(){const list=mAnalysisTasks();return title('生产力分析','以当前范围任务事实分析投入、维护人工基线并冻结报告。')+mBanner()+mAnalysisFilters()+mTabs(['总览','投入与基线','报告管理'],mAnalysis,'mAnalysis')+(mAnalysis==='报告管理'?mReports():mCards(mMetrics(list))+(mAnalysis==='总览'?`<div class="card card-body"><h2>按任务范围汇总</h2>${muTable(['任务范围','已验收','已知投入','净节省工时'],[...new Set(list.map(t=>t.anchor))].map(scope=>{const a=mMetrics(list.filter(t=>t.anchor===scope));return `<tr><td>${esc(scope)}</td><td>${a.accepted}</td><td>¥ ${mNum(a.knownCost)}</td><td>${mNum(a.netHours)} h</td></tr>`;}))}</div>`:`<div class="card"><h2 class="card-body">任务投入与基线覆盖</h2>${mCostTable(list)}</div><p>基线仅匹配同企业、范围、质量要求的已验收成果；缺失不估算全量。</p>${mConfigList('baselines','人工基线管理','维护来源样本、质量要求、工时与费率；草稿提交审核后发布，历史报告保留原版本。')}`));};

(function(root){
'use strict';
const arg=x=>JSON.stringify(String(x)), action=(label,code,primary=false)=>btn(label,code,primary);
const visible=x=>!!x&&(typeof mQualityVisible==='function'?mQualityVisible(x):true);
const sets=()=>quality.sets.filter(visible), experiments=()=>quality.experiments.filter(visible);
const json=x=>'<pre>'+esc(JSON.stringify(x,null,2))+'</pre>';
let reviewFilter='全部',reviewQuery='',onlineTab='队列',onlineFilter='全部',onlineQuery='';
function mismatch(a,b){const fields=[['实验类型','kind'],['发布数据版本','dataRef'],['用途分桶','bucket'],['冻结样本','samples'],['数据与质量标准快照','data'],['评估器标准快照','evaluator'],['评估器版本','evalRef']];return fields.filter(([,k])=>JSON.stringify(a[k])!==JSON.stringify(b[k])).map(([n])=>n);}
function compare(){const list=[...comparison].map(findExp).filter(x=>x&&visible(x));if(list.length<2||list.some(x=>!x||x.state!=='已完成')){toast('请选择至少两个当前范围内的完成实验');return;}const base=list[0],differences=list.slice(1).map(e=>({e,fields:mismatch(base,e)})),fair=differences.every(x=>!x.fields.length);let body='<div class="notice">'+(fair?'冻结输入与判定标准一致，可进行逐样本公平比较。':'当前为描述性并列查看。不同输入或标准的分数不可直接排名，也不计算跨实验提升率。')+' 本地模拟结果不构成业务验收或统计显著性结论。</div><div class="card table-wrap"><table><thead><tr><th>实验</th><th>类型 / 用途</th><th>数据 / 评估器</th><th>对齐检查</th><th>操作</th></tr></thead><tbody>'+list.map((e,i)=>'<tr><td>'+esc(e.name)+'</td><td>'+esc(e.kind+' / '+e.bucket)+'</td><td>'+esc(e.dataRef+' / '+e.evalRef)+'</td><td>'+esc(i?(differences[i-1].fields.join('、')||'全部一致'):'比较参考')+'</td><td>'+action('实验详情','experimentDetail('+arg(e.id)+')')+'</td></tr>').join('')+'</tbody></table></div>';
if(!fair)body+='<div class="section"><h3>建立公平对照</h3><p>以首个实验为参照，选择相同数据发布版、样本分桶与评估器发布版的已完成实验；或创建配置匹配的新实验。</p>'+action('选择兼容完成实验','QualityUX.selectCompatible('+arg(base.id)+')')+action('创建匹配实验','QualityUX.createMatched('+arg(base.id)+')',true)+'</div>';
body+=list.map(e=>'<section class="card card-body"><h2>'+esc(e.name)+'</h2><p>'+esc(e.baseline+' → '+e.candidate)+'</p>'+summaryCards(e)+'</section>').join('');
if(fair)body+='<div class="card table-wrap"><table><thead><tr><th>冻结样本</th>'+list.map(e=>'<th>'+esc(e.name)+'</th>').join('')+'</tr></thead><tbody>'+base.samples.map(s=>'<tr><td>'+esc(s.id+' / '+s.input)+'</td>'+list.map(e=>{const r=e.rows.find(r=>r.sampleId===s.id);return '<td>'+(r?e.kind==='方案对照'?'基线 '+number(r.baseline.score)+' → 候选 '+number(r.candidate.score):'评分 '+number(r.score)+' / 参考 '+esc(r.reference):'缺少结果')+'</td>';}).join('')+'</tr>').join('')+'</tbody></table></div>';
root.detailPage(fair?'完成实验公平比较':'完成实验描述性比较',body,action('返回实验列表',"navigate('experiments')"));}
function selectCompatible(id){const base=findExp(id),list=experiments().filter(e=>e.state==='已完成'&&!mismatch(base,e).length);comparison.clear();list.forEach(e=>comparison.add(e.id));navigate('experiments');toast(list.length>1?'已选择 '+list.length+' 个兼容实验':'当前只有参考实验兼容，请创建匹配实验');}
function createMatched(id){const e=findExp(id);createExperiment(e.kind);for(const [key,value] of [['name',e.name+' · 匹配对照'],['kind',e.kind],['data',e.dataRef],['bucket',e.bucket],['base',e.baseline],['candidate',e.candidate],['eval',e.evalRef]]){const node=document.getElementById('x-'+key);if(node)node.value=value;}}
function reviewPage(){const all=QualityGovernance.snapshot().reviews,rows=all.filter(r=>(reviewFilter==='全部'||r.state===reviewFilter)&&(r.id+r.setId+r.sampleId+r.submitter+(r.assignee||'')).includes(reviewQuery));const waiting=all.filter(r=>r.state==='待独立复核');return title('独立质量复核','核验他人提交的标注，处理分歧并保留复核记录。样本标注在评测集中完成。',action('开始复核','uiStartReview()',true)+action('管理评测集',"navigate('datasets')"))+'<div class="metrics">'+metric('待分派',waiting.filter(r=>!r.assignee).length,'','标注提交人与复核人必须不同')+metric('待复核',waiting.filter(r=>r.assignee).length,'','当前操作人 '+esc(mActor))+metric('分歧待仲裁',all.filter(r=>r.state==='分歧待仲裁').length,'','由第三方处理')+metric('已完成',all.filter(r=>['已复核','已仲裁'].includes(r.state)).length,'','生效后才可用于发布')+'</div><div class="card card-body"><h2>复核工作台</h2><div class="session-summary"><p class="subtle">当前操作人 '+esc(mActor)+'</p><div class="session-action">'+action('原型身份演练','uiSessionDialog()')+'</div></div><div class="filter-bar"><label class="field search-field">搜索复核任务<input type="search" aria-label="搜索复核任务" placeholder="任务 / 评测集 / 样本 / 操作人" value="'+esc(reviewQuery)+'" onchange="QualityUX.reviewSearch(this.value)"></label><label class="field">复核状态<select aria-label="复核状态" onchange="QualityUX.reviewStatus(this.value)">'+options(['全部','待独立复核','分歧待仲裁','已复核','已仲裁'],reviewFilter)+'</select></label></div><p class="subtle">复核人必须与标注人不同。草稿变更后需重新提交，复核只影响质量标签。</p><div class="table-wrap"><table><thead><tr><th>复核任务 / 样本</th><th>提交人 / 提议</th><th>独立复核人</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.id)+'<p>'+esc(r.setId+' / '+r.sampleId)+'</p></td><td>'+esc(r.submitter+' / '+r.proposed)+'</td><td>'+esc(r.assignee||'尚未分派')+'</td><td>'+esc(r.state)+'</td><td>'+action(r.state==='待独立复核'?'复核 / 分派':r.state==='分歧待仲裁'?'处理仲裁':'查看记录','QualityUX.reviewDetail('+arg(r.id)+')')+'</td></tr>').join('')+'</tbody></table></div>'+(!rows.length?'<div class="empty">'+(all.length?'没有匹配的复核任务，请调整筛选。':'尚无复核任务。先从评测集草稿选择样本、提交标签与依据，再分派给另一位操作人。')+'</div>':'')+'</div>'+notice();}

function uiReviewState(d,s){const pending=QualityGovernance.snapshot().reviews.find(r=>r.setId===d.id&&r.sampleId===s.id&&['待独立复核','分歧待仲裁'].includes(r.state)&&JSON.stringify(r.inputSnapshot)===JSON.stringify(s));return pending?{label:pending.state,pending}:s.labelAudit?{label:'已复核'}:{label:'待标注'};}

QualityUX.labelPicker=function(setId){const ds=quality.sets.filter(mQualityVisible);if(setId&&!ds.some(d=>d.id===setId))return toast('评测集不在当前范围');if(setId)uiPickerSet=setId;if(!ds.some(d=>d.id===uiPickerSet))uiPickerSet=ds[0]?.id||'';const d=ds.find(d=>d.id===uiPickerSet);const rows=(d?.samples||[]).filter(s=>(uiPickerStatus==='全部'||uiReviewState(d,s).label===uiPickerStatus)&&(s.id+s.input+s.source).toLowerCase().includes(uiPickerQuery.toLowerCase()));detailPage('标注样本',uiSteps(0)+`<p>为当前评测集准备参考标签并分派独立复核。已有待处理任务无需重复提交。</p><div class="card card-body"><div class="filter-bar"><div class="field"><span>当前评测集</span><b>${esc(d?.name||'暂无评测集')}</b></div><label class="field search-field">搜索样本<input type="search" aria-label="搜索标注样本" placeholder="样本 ID、输入或来源" value="${esc(uiPickerQuery)}" onchange="uiPickerQuery=this.value;QualityUX.labelPicker(${esc(jsarg(uiPickerSet))})"></label><label class="field">处理状态<select onchange="uiPickerStatus=this.value;QualityUX.labelPicker(${esc(jsarg(uiPickerSet))})">${options(['待标注','待独立复核','分歧待仲裁','已复核','全部'],uiPickerStatus)}</select></label></div>${d?`<p class="subtle">${esc(d.description)} · 当前显示 ${rows.length} / ${d.samples.length} 条样本</p>`:''}${muTable(['样本 / 输入','来源','处理状态','下一步'],rows.map(s=>{const status=uiReviewState(d,s);return `<tr><td><b>${esc(s.id)}</b><p class="truncate-text">${esc(s.input)}</p></td><td class="wrap-cell">${esc(s.source)}</td><td>${esc(status.label)}</td><td>${status.pending?btn('查看复核任务',`QualityUX.reviewDetail(${jsarg(status.pending.id)})`):status.label==='已复核'?btn('查看样本',`QualityUX.labelSample(${jsarg(d.id)},${jsarg(s.id)})`):btn('开始标注',`QualityUX.labelSample(${jsarg(d.id)},${jsarg(s.id)})`,true)}</td></tr>`;}),'没有符合条件的样本。可切换处理状态，或到评测集新增样本。')}</div>`,btn('返回评测集管理',`uiDatasetDetail(${jsarg(uiPickerSet)})`)+btn('查看复核工作台',"navigate('qualityReview')"));};
QualityUX.labelSample=function(id,sid){const d=findSet(id),s=d?.samples.find(x=>x.id===sid);if(!d||!s||!mQualityVisible(d))return toast('样本不在当前范围');const status=uiReviewState(d,s),actors=uiEligibleActors();detailPage('样本标注 · '+sid,uiSteps(1)+`<p>${esc(d.name)} · 当前标注人 ${esc(mActor)}。先核对输入、预期与成果，再填写标签、证据依据并选择独立复核人。</p><div class="detail-columns"><section class="card card-body stack"><h2>核验材料</h2><div class="evidence-block"><h3>业务输入</h3><p>${esc(s.input)}</p></div><div class="evidence-block"><h3>预期与质量要求</h3><p>${esc(s.expected)}</p></div><div class="evidence-block"><h3>实际成果</h3><pre>${esc(s.actual)}</pre></div><p class="subtle">来源：${esc(s.source)}</p></section><section class="card card-body stack"><h2>标注与分派</h2>${status.pending?`<div class="notice">此样本已有 ${esc(status.label)} 任务，继续处理现有任务。</div>${btn('继续复核',`QualityUX.reviewDetail(${jsarg(status.pending.id)})`,true)}`:status.label==='已复核'?`<div class="notice">此样本已完成独立复核。重新标注应保留已有审计记录。</div>${btn('重新标注',`uiRelabel(${jsarg(id)},${jsarg(sid)})`)}`:`${field('提议标签','qg-label','通过','select',['通过','不通过'])}${field('核验依据（说明事实、引用和判断理由）','qg-reason','','textarea')}${field('独立复核人','qg-assignee',actors[0]||'','select',actors)}<p class="subtle">复核人必须与标注人不同。${actors.length?'提交后进入复核工作台，由选定成员处理。':'暂无具备复核权限的其他成员，请先添加成员或分配角色。'}</p>${btn('提交标注并分派',`uiSubmitLabel(${jsarg(id)},${jsarg(sid)})`,true)}`}</section></div>`,btn('返回样本列表',`QualityUX.labelPicker(${jsarg(id)})`));};

function uiRelabel(id,sid){const original=quality.sets.find(d=>d.id===id)?.samples.find(s=>s.id===sid);if(!original)return;modal('重新标注',`<p>重新提交标签将保留历史审核记录，新标签通过独立复核后生效。</p>${field('提议标签','qg-label',original.reference,'select',['通过','不通过'])}${field('核验依据','qg-reason','','textarea')}${field('独立复核人','qg-assignee',uiEligibleActors()[0]||'','select',uiEligibleActors())}`,btn('取消','closeModal()')+btn('提交并分派',`uiSubmitLabel(${jsarg(id)},${jsarg(sid)})`,true));}
function uiSubmitLabel(id,sid){QualityGovernance.ui(()=>{const assignee=val('qg-assignee'),reason=validText(val('qg-reason'),'核验依据');if(!uiEligibleActors().includes(assignee))throw Error('请选择具备复核权限的独立成员');mRequire('quality.offline.write');mRequire('quality.review.assign');const d=findSet(id),s=d?.samples.find(s=>s.id===sid);if(!s||uiReviewState(d,s).pending)throw Error('样本已有待处理复核任务');const previous=mCopy(quality),raw=localStorage.getItem(STORE);try{const rid=QualityGovernance.submitLabel(id,sid,val('qg-label'),reason);QualityGovernance.assign(rid,assignee);closeModal();uiPickerStatus='待独立复核';QualityUX.labelPicker(id);toast('标注已提交，已分派给 '+assignee);}catch(e){quality=previous;try{if(raw===null)localStorage.removeItem(STORE);else localStorage.setItem(STORE,raw);}catch(_){throw Error('提交失败，存储回滚未完成，请检查本地备份');}throw e;}});}

function uiDatasetDetail(id){const d=findSet(id);if(!d||!mQualityVisible(d))return toast('评测集不在当前范围');const g=QualityGovernance.snapshot(),m=g.sets[id]||{},pending=g.reviews.filter(r=>r.setId===id&&['待独立复核','分歧待仲裁'].includes(r.state)),done=d.samples.filter(s=>s.labelAudit&&s.reference!=='待标注').length;const checks=[['来源与数据授权',m.sourceReview==='通过'&&!!m.authorization],['责任人与质量标准',!!m.owner&&!!m.standard],['样本去重与用途隔离',!!m.deduplicated],['全部样本独立复核',d.samples.length>0&&done===d.samples.length],['无待处理复核或分歧',pending.length===0]];detailPage('评测集管理 · '+d.name,`<p>发布前依次完成下面三项。发布版本冻结样本与标准，后续编辑只影响草稿。</p><div class="stack"><div class="card card-body stack"><div class="toolbar"><h2>1. 配置来源与质量标准</h2>${btn('配置',`QualityGovernance.editDataset(${jsarg(id)})`)}</div><div class="detail-summary">${[['责任人','owner'],['任务族','family'],['用途','purpose'],['来源审核','sourceReview'],['标准','standard'],['授权依据','authorization']].map(([label,key])=>`<div><small>${label}</small>${esc(m[key]||'未配置')}</div>`).join('')}</div></div><div class="card card-body stack"><div class="toolbar"><h2>2. 标注与独立复核</h2>${btn('标注样本',`uiOpenDatasetLabels(${jsarg(id)})`,true)}</div><p>${done} / ${d.samples.length} 条样本已复核，${pending.length} 个任务待处理。</p><div class="actions">${btn('维护样本',`openSet(${jsarg(id)})`)}${btn('进入复核工作台',"navigate('qualityReview')")}</div></div><div class="card card-body stack"><h2>3. 检查并发布版本</h2><ul class="check-list">${checks.map(([label,pass])=>`<li><span class="check-status ${pass?'good':''}">${pass?'已完成':'待完成'}</span>${label}</li>`).join('')}</ul><div class="actions"><button class="primary" ${checks.every(x=>x[1])&&uxCan('quality.offline.write')?'':'disabled'} onclick="uiPublishDataset(${esc(jsarg(id))})">发布新版本</button></div><p class="subtle">${checks.every(x=>x[1])?'已满足发布条件。':'先完成标为“待完成”的项目，再发布新版本。'}</p></div><div class="card card-body"><h2>发布历史</h2>${muTable(['版本','发布时间','样本数','操作'],d.versions.map(v=>`<tr><td>v${v.number}</td><td>${esc(v.at)}</td><td>${v.samples.length}</td><td>${btn('查看冻结样本',`sampleVersion=${jsarg(String(v.number))};activeSet=${jsarg(id)};openSet(${jsarg(id)})`)}</td></tr>`),'暂无发布版本。')}</div></div>`,btn('返回评测集',"navigate('datasets')"));}

pages.experiments=function(){if(!uxCan('task.read'))return title('访问受限','当前角色没有查看实验的权限。');const all=quality.experiments.filter(mQualityVisible),list=all.filter(e=>(uiExperimentKind==='全部'||e.kind===uiExperimentKind)&&(expFilter==='全部'||e.state===expFilter)&&(e.name+e.kind+e.dataRef).toLowerCase().includes(expSearch.toLowerCase())),selected=uiExperimentSelection();const fair=selected.length>1&&selected.slice(1).every(e=>!QualityUX.mismatch(selected[0],e).length);
return title('实验与对比','使用冻结数据和评估标准验证方案；方案对照与判定校准分别组织。',mButton('创建实验','createExperiment()','quality.offline.write'))+`<div class="card card-body stack"><div class="filter-bar"><label class="field search-field">搜索实验<input type="search" placeholder="名称、类型或数据版本" value="${esc(expSearch)}" onchange="expSearch=this.value;render()"></label><label class="field">实验类型<select onchange="uiExperimentKind=this.value;render()">${options(['全部','方案对照','判定校准'],uiExperimentKind)}</select></label><label class="field">运行状态<select onchange="expFilter=this.value;render()">${options(['全部','排队','运行中','已完成','失败','已取消'],expFilter)}</select></label><div class="filter-action">${btn('重置筛选',"expSearch='';expFilter='全部';uiExperimentKind='全部';render()")}</div></div><div class="comparison-bar"><div><b>已选 ${selected.length} 个完成实验</b><p class="subtle">${selected.length<2?'选择至少两个完成实验进行比较。':fair?'输入与判定标准一致，可逐样本比较。':'输入或标准存在差异，比较将展示差异及独立结果。'} 筛选不会清除选择。</p></div><div class="actions">${selected.length?btn('清空选择','uiClearExperiments()'):''}<button class="primary" ${selected.length<2?'disabled':''} onclick="compareExperiments()">比较所选</button></div></div>${selected.length?`<div class="selection-chips">${selected.map(e=>`<button class="selection-chip" aria-label="移除实验 ${esc(e.name)}" onclick="uiToggleExperiment(${esc(jsarg(e.id))},false)">${esc(e.name)} <span aria-hidden="true">×</span></button>`).join('')}</div>`:''}<p class="subtle">显示 ${list.length} / ${all.length} 个实验 · 运行结果为本地模拟</p>${muTable(['比较','实验 / 类型','数据与评估器版本','运行状态','操作'],list.map(e=>`<tr><td>${e.state==='已完成'?`<input type="checkbox" aria-label="选择实验 ${esc(e.name)}" ${comparison.has(e.id)?'checked':''} onchange="uiToggleExperiment(${esc(jsarg(e.id))},this.checked)">`:'—'}</td><td class="wrap-cell"><b>${esc(e.name)}</b><p>${esc(e.kind)} · ${esc(e.bucket)}</p></td><td class="wrap-cell">${esc(e.dataRef)}<p>${esc(e.evalRef)}</p></td><td><span class="badge ${e.state==='已完成'?'green':e.state==='失败'?'amber':'gray'}">${esc(e.state)}</span><p>尝试 ${e.attempt}</p></td><td><div class="actions row-actions">${btn('查看详情',`experimentDetail(${jsarg(e.id)})`)}${e.state==='失败'?mButton('重试',`retryExperiment(${jsarg(e.id)})`,'quality.offline.write'):['排队','运行中'].includes(e.state)?mButton('取消运行',`uiCancelExperiment(${jsarg(e.id)})`,'quality.offline.write'):''}</div></td></tr>`),'暂无匹配实验。可调整筛选或创建实验。')}</div>`;
};
function uiCancelExperiment(id){const e=findExp(id);if(!e||!mQualityVisible(e))return toast('实验不在当前范围');modal('取消运行',`<p>确认取消 ${esc(e.name)}？已有运行记录和投入证据会保留。</p>`,btn('返回','closeModal()')+mButton('确认取消',`closeModal();transitionExperiment(${jsarg(id)},'已取消')`,'quality.offline.write'));}
function uiExecutionSummary(e){const results=e.rows.map(r=>r.candidate||r),valid=results.filter(r=>r.score!==null&&Number.isFinite(r.score)),costs=results.filter(r=>Number.isFinite(r.cost));return `<div class="metrics">${metric('已记录结果',results.length+' / '+e.samples.length,'','冻结样本')}${metric('评测通过',valid.filter(r=>r.pass===true).length+' / '+valid.length,'','仅计适用范围内结果')}${metric('平均评分',valid.length?number(valid.reduce((n,r)=>n+r.score,0)/valid.length):'暂无评分','','本次执行结果')}${metric('模拟执行成本',costs.length?'¥ '+number(costs.reduce((n,r)=>n+r.cost,0)):'未记录','','非账单；覆盖 '+costs.length+' / '+results.length+' 条结果')}</div><p class="subtle">此处展示单次实验执行。跨实验比较仅在列表选择多个已完成实验后进行。</p>`;}
function uiExperimentDetail(id,tab='概况'){
const e=findExp(id);if(!e||!mQualityVisible(e))return toast('实验不在当前范围');const g=QualityGovernance.snapshot().experiments[id];
let body=`<div class="detail-summary">${[['类型',e.kind],['状态',e.state],['数据版本',e.dataRef],['评估器版本',e.evalRef]].map(([label,value])=>`<div><small>${label}</small>${esc(value)}</div>`).join('')}</div>`;
body+=`<div class="stack"><div class="card card-body stack"><h2>实验目标</h2><p>执行方案：${esc(e.candidate)}</p><p class="subtle">执行来源：本地模拟；方案名称为登记信息，未绑定真实执行器。</p><p class="subtle">${esc(e.bucket)} · ${e.samples.length} 个冻结样本 · 尝试 ${e.attempt}</p>${e.error?`<div class="notice">${esc(e.error)}</div>`:''}</div><div class="card card-body stack"><h2>结果摘要</h2>${e.state==='已完成'?uiExecutionSummary(e):'<div class="empty">尚无完成结果。失败与取消不会作为零分结果计算。</div>'}</div></div>`;
body+=`<div class="card card-body stack"><details><summary>逐样本结果 · ${e.rows.length} 条</summary>${muTable(['样本 / 输入','本次执行成果','评测结果','记录投入'],e.rows.map(r=>{const result=r.candidate||r;return `<tr><td class="wrap-cell"><b>${esc(r.sampleId)}</b><p>${esc(r.input)}</p><p class="subtle">${esc(r.source)}</p></td><td class="wrap-cell">${esc(result.actual||e.samples.find(s=>s.id===r.sampleId)?.actual||'未记录')}</td><td>${resultCell(result)}</td><td>${Number.isFinite(result.cost)?'¥ '+number(result.cost)+'（模拟）':'未记录'}</td></tr>`;}),'尚无逐样本执行结果。')}</details></div>`;
body+=`<div class="stack"><div class="card card-body stack"><div class="toolbar"><h2>执行配置与投入</h2><div class="actions">${mButton('运行配置',`QualityGovernance.runConfigDialog(${jsarg(id)})`,'quality.offline.write')}${mButton('导入外部结果',`QualityGovernance.externalDialog(${jsarg(id)})`,'quality.offline.write')}</div></div><p class="subtle">选择执行资产和预算；运行开始后配置冻结。本地模拟不会连接真实 Agent。</p><details><summary>运行配置与投入明细</summary>${mJSON(g?.config||{})}${mJSON(QualityGovernance.investment(id))}</details></div><div class="card card-body stack"><details><summary>逐样本执行与重试</summary>${muTable(['冻结样本','输入','操作'],e.samples.map(s=>`<tr><td>${esc(s.id)}</td><td class="wrap-cell">${esc(s.input)}</td><td>${btn('执行记录与处理',`QualityGovernance.sampleDialog(${jsarg(id)},${jsarg(s.id)})`)}</td></tr>`),'暂无冻结样本。')}</details></div><div class="card card-body stack"><div class="toolbar"><h2>实验结论</h2>${btn('结论与审核',`QualityGovernance.conclusionDialog(${jsarg(id)})`)}</div><p>${esc(g?.conclusion?.text||'尚未提交结论。完成样本执行后提交依据，并由其他成员审核。')}</p><p class="subtle">${esc(g?.conclusion?.state||'待提交')}</p></div></div>`;
body+=`<div class="stack"><div class="card card-body stack"><details><summary>运行时间线</summary><div class="timeline"><div class="event">创建<small>${esc(e.created)}</small></div>${e.events.map(v=>`<div class="event">${esc(v.state)} · 尝试 ${v.attempt}<small>${esc(v.at)}</small></div>`).join('')}</div></details></div><div class="card card-body"><details><summary>冻结数据与运行证据</summary>${mJSON(e)}${mJSON(g||{})}</details></div></div>`;
detailPage('实验详情 · '+e.name,body,btn('返回实验列表',"navigate('experiments')")+btn('刷新',`experimentDetail(${jsarg(id)},${jsarg(tab)})`)+mButton('导出结果',`download('实验结果',findExp(${jsarg(id)}))`,'task.export')+(e.state==='已完成'?btn('选择兼容实验',`QualityUX.selectCompatible(${jsarg(id)})`):''));
}
uxDetailHandlers.experiment=uiExperimentDetail;experimentDetail=(...args)=>uxOpen('experiment',args);
QualityGovernance.experimentDialog=id=>experimentDetail(id,'执行与结论');
const uiCreateExperiment=createExperiment;
uxDetailHandlers['create-experiment']=(kind='方案对照')=>{if(!uxCan('quality.offline.write'))return toast('当前角色没有创建实验权限');uiCreateExperiment(kind);};
createExperiment=(...args)=>uxOpen('create-experiment',args);
uxDetailHandlers.compare=ids=>{comparison.clear();ids.forEach(id=>comparison.add(id));QualityUX.compare();if(uxDetail?.body){uxDetail.body='<div class="stack comparison-workspace">'+uxDetail.body.replace(/<div class="section">/g,'<div class="card card-body stack">')+'</div>';uxRenderDetail();}};

const uiSaveExperiment=saveExperiment;saveExperiment=function(){const before=new Set(quality.experiments.map(e=>e.id));uiSaveExperiment();const created=quality.experiments.find(e=>!before.has(e.id));if(created)experimentDetail(created.id);};
// END COMPONENT UX
if(location.hash.slice(1).startsWith('detail/'))navigate(location.hash.slice(1));else render();
// END UX UPGRADE
</script></body></html>
